name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: genshin-role-tool/package-lock.json

      - name: Install dependencies
        working-directory: genshin-role-tool
        run: npm ci

      - name: Build (subpath base for project pages)
        working-directory: genshin-role-tool
        env:
          GITHUB_PAGES: '1'
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: genshin-role-tool/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
