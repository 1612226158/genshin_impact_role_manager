<!DOCTYPE html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>诊断 · replaceState</title></head>
  <body style="background:#0b1b28;color:#d3bc8e;font:15px system-ui;padding:40px">
    <p>本页只做一件事：加载时调用一次 history.replaceState。</p>
    <p id="st">done</p>
    <script>
      try {
        history.replaceState({}, '', '/repl-test?from=rr')
        document.getElementById('st').textContent =
          'replaceState 已执行，当前路径: ' + location.pathname + location.search
      } catch (e) {
        document.getElementById('st').textContent = 'replaceState 抛错: ' + e.message
      }
    </script>
  </body>
</html>
